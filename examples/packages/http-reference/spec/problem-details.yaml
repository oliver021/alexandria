$schema: https://json-schema.org/draft/2020-12/schema
title: Problem details for HTTP APIs
description: >-
  Shape of an error response sent with the media type application/problem+json,
  following RFC 9457. Every member is optional. Clients must ignore members they
  do not know, so servers may add their own.
type: object
properties:
  type:
    type: string
    format: uri-reference
    default: about:blank
    description: >-
      Identifier of the kind of problem. When it is a URL it should lead to
      documentation. The value about:blank means that the problem has no
      meaning beyond the HTTP status code.
  title:
    type: string
    description: >-
      Short, human readable summary of the kind of problem. It should not
      change from one occurrence to another.
  status:
    type: integer
    minimum: 100
    maximum: 599
    description: >-
      HTTP status code of the response. It repeats the status line so that the
      body can be understood without it.
  detail:
    type: string
    description: >-
      Explanation specific to this occurrence of the problem, written to help
      the client fix it.
  instance:
    type: string
    format: uri-reference
    description: >-
      Identifier of this particular occurrence, for example the request path or
      a correlation id.
additionalProperties: true
x-guidance:
  content_type: application/problem+json
  rules:
    - Send the same status code in the HTTP status line and in the status member.
    - Do not put stack traces, file paths or credentials in detail.
    - Prefer a stable type URL over parsing the title or the detail.
    - Add extension members, such as errors for field-level problems, instead of overloading detail.
examples:
  - type: https://api.example.org/problems/validation-error
    title: The request body is not valid.
    status: 422
    detail: Two fields failed validation.
    instance: /orders/8841
    errors:
      - field: quantity
        message: must be at least 1
      - field: shipping.country
        message: is not a supported country code
  - type: about:blank
    title: Not Found
    status: 404
  - type: https://api.example.org/problems/rate-limited
    title: Too many requests.
    status: 429
    detail: The limit is 100 requests per minute.
    retry_after_seconds: 30
